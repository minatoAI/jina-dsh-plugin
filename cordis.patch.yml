# dsh-jina bundle layer — applied on top of a dsh profile's composition.
#
# Two rows:
#   - dsh-jina      host plugin: the twelve jina_* model tools and the network
#                   transport. The API key lives in the host credential seam
#                   (reference JINA_API_KEY, written by the web settings page
#                   via credentials.set) — this patch defines no settings.
#   - dsh-jina/ui   dual-face client package: an empty host half plus the
#                   prebuilt browser bundle that registers the "Jina Tools"
#                   page in the web settings panel.
- insert:
    - id: jina-tools
      name: dsh-jina

    - id: jina-settings-ui
      name: dsh-jina/ui
